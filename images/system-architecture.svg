<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182333"/>
      <stop offset="100%" stop-color="#111926"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="14" fill="#0c121b" stroke="rgba(255,255,255,0.08)"/>

  <!-- Top: Input Layer -->
  <rect x="40" y="30" width="820" height="70" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="52" fill="#3b82f6" font-size="12" font-family="Inter,sans-serif" font-weight="700" letter-spacing="1">DATA &amp; INCIDENT INGESTION LAYER</text>
  <rect x="60" y="62" width="165" height="26" rx="6" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1"/>
  <text x="142" y="79" fill="#eef3f9" font-size="11" font-family="Inter,sans-serif" text-anchor="middle">Mobile SOS &amp; GPS Telemetry</text>

  <rect x="245" y="62" width="175" height="26" rx="6" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1"/>
  <text x="332" y="79" fill="#eef3f9" font-size="11" font-family="Inter,sans-serif" text-anchor="middle">Hydrological &amp; Terrain Feeds</text>

  <rect x="440" y="62" width="185" height="26" rx="6" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="1"/>
  <text x="532" y="79" fill="#eef3f9" font-size="11" font-family="Inter,sans-serif" text-anchor="middle">Hospital EHR &amp; Triage Queues</text>

  <rect x="645" y="62" width="195" height="26" rx="6" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1"/>
  <text x="742" y="79" fill="#eef3f9" font-size="11" font-family="Inter,sans-serif" text-anchor="middle">Multilingual Relief Appeals</text>

  <!-- Connectors from Input to Processing -->
  <path d="M142 100 v35 M332 100 v35 M532 100 v35 M742 100 v35" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Middle: Processing & AI Core -->
  <rect x="40" y="135" width="820" height="150" rx="10" fill="url(#cardGrad)" stroke="rgba(59,130,246,0.3)"/>
  <text x="60" y="160" fill="#60a5fa" font-size="12" font-family="Inter,sans-serif" font-weight="700" letter-spacing="1">SMARTRELIEF CORE AI &amp; ANALYTICAL ENGINE</text>

  <!-- Submodule 1 -->
  <rect x="60" y="175" width="240" height="92" rx="8" fill="#141c27" stroke="rgba(59,130,246,0.3)"/>
  <text x="75" y="198" fill="#eef3f9" font-size="12" font-family="Inter,sans-serif" font-weight="700">1. Emergency &amp; Hazard Module</text>
  <text x="75" y="218" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• Random Forest Hazard Model</text>
  <text x="75" y="234" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• Proximity Route Planner</text>
  <text x="75" y="250" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• Camp Site Suitability Ranker</text>

  <!-- Submodule 2 -->
  <rect x="330" y="175" width="240" height="92" rx="8" fill="#141c27" stroke="rgba(6,182,212,0.3)"/>
  <text x="345" y="198" fill="#eef3f9" font-size="12" font-family="Inter,sans-serif" font-weight="700">2. Relief Prediction Module</text>
  <text x="345" y="218" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• YOLOv8n Head Counting</text>
  <text x="345" y="234" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• Government-Rate Demand</text>
  <text x="345" y="250" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• In-Browser JSON Decision Trees</text>

  <!-- Submodule 3 -->
  <rect x="600" y="175" width="240" height="92" rx="8" fill="#141c27" stroke="rgba(34,197,94,0.3)"/>
  <text x="615" y="198" fill="#eef3f9" font-size="12" font-family="Inter,sans-serif" font-weight="700">3. Patient Triage &amp; Appeals</text>
  <text x="615" y="218" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• 5-Model Stacked Ensemble</text>
  <text x="615" y="234" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• 31 Critical Bypass Triggers</text>
  <text x="615" y="250" fill="#8e9fb5" font-size="10.5" font-family="Inter,sans-serif">• Tri-Lingual Appeal Scorer</text>

  <!-- Connectors to Output -->
  <path d="M180 285 v35 M450 285 v35 M720 285 v35" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Bottom: Presentation & Action Layer -->
  <rect x="40" y="320" width="820" height="70" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="342" fill="#22c55e" font-size="12" font-family="Inter,sans-serif" font-weight="700" letter-spacing="1">DISPATCH, DASHBOARD &amp; DONATION PLATFORM</text>
  <rect x="60" y="352" width="230" height="26" rx="6" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1"/>
  <text x="175" y="369" fill="#eef3f9" font-size="11" font-family="Inter,sans-serif" text-anchor="middle">Responder &amp; Coordinator Portal</text>

  <rect x="320" y="352" width="260" height="26" rx="6" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1"/>
  <text x="450" y="369" fill="#eef3f9" font-size="11" font-family="Inter,sans-serif" text-anchor="middle">Camp Management &amp; Relief Logistics</text>

  <rect x="610" y="352" width="230" height="26" rx="6" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="1"/>
  <text x="725" y="369" fill="#eef3f9" font-size="11" font-family="Inter,sans-serif" text-anchor="middle">Medical Triage &amp; Donation Gateway</text>
</svg>
